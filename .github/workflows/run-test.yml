name: Checkstyle & TeamCity Cloud Startup

on:
  push:
    branches: [ nikita_ci ]
  workflow_dispatch:

jobs:
  infrastructure:
    name: Code Control & Cloud Server Startup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: 'maven'

      # 1. Проверка чекстайла (уже работает стабильно)
      - name: Run Checkstyle
        run: mvn checkstyle:check

      # 2. Создаем изолированную сеть
      - name: Create Custom Docker Network
        run: docker network create test-network

      # 3. Запуск сервера с ROOT-правами (--user 0), чтобы обойти ограничения диска
      - name: Start TeamCity Server
        run: |
          docker run -d --name teamcity-server \
            --network test-network \
            -p 8111:8111 \
            --user 0 \
            -e TEAMCITY_SERVER_OPTS="-Dteamcity.startup.maintenance=false" \
            jetbrains/teamcity-server:latest

      # 4. Умное ожидание через внутренний статус контейнера + вывод логов
      - name: Wait for TeamCity to be ready
        run: |
          echo "Ожидаем запуск TeamCity Server..."
          # Даем серверу 3 минуты. Каждые 15 секунд проверяем, что контейнер не упал
          for i in {1..12}; do
            STATUS=$(docker inspect --format='{{.State.Status}}' teamcity-server)
            echo "Текущий статус контейнера: $STATUS"
            if [ "$STATUS" != "running" ]; then
              echo "Ошибка! Контейнер аварийно завершил работу."
              docker logs teamcity-server
              exit 1
            fi
            sleep 15
          done
          
          echo "Проверяем доступность веб-интерфейса..."
          curl -s -I http://localhost:8111/login.html || echo "Сервер еще разогревается..."

      # 5. Экстракт токена суперадмина из логов
      - name: Extract Super User Token
        run: |
          echo "Вытаскиваем токен из логов..."
          TOKEN=$(docker logs teamcity-server 2>&1 | grep -oP "Super User Token:\s+\K\d+" || echo "not_found")
          echo "Extracted Token: $TOKEN"
