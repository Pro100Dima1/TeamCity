name: Checkstyle Verification

on:
  push:
    branches: [ nikita_ci ]
  workflow_dispatch:

jobs:
  checkstyle:
    name: Code Quality Control
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: 'maven'

      - name: Run Checkstyle
        run: mvn checkstyle:check
