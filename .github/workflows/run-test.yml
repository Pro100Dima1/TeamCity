name: Checkstyle & TeamCity Cloud Startup

on:
  push:
    branches: [ nikita_ci ]
  workflow_dispatch:

jobs:
  infrastructure:
    name: Code Control & Cloud Server Startup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: 'maven'

      - name: Run Checkstyle
        run: mvn checkstyle:check

      - name: Create Custom Docker Network
        run: docker network create test-network

      - name: Start TeamCity Server
        run: |
          docker run -d --name teamcity-server \
            --network test-network \
            -p 8111:8111 \
            --user 0 \
            -e TEAMCITY_SERVER_OPTS="-Dteamcity.startup.maintenance=false" \
            jetbrains/teamcity-server:latest

      - name: Wait for TeamCity to be ready
        run: |
          echo "Ожидаем запуск TeamCity Server..."
          for i in {1..12}; do
            STATUS=$(docker inspect --format='{{.State.Status}}' teamcity-server)
            echo "Текущий статус контейнера: $STATUS"
            if [ "$STATUS" != "running" ]; then
              echo "Ошибка! Контейнер аварийно завершил работу."
              docker logs teamcity-server
              exit 1
            fi
            sleep 15
          done
          
          echo "Проверяем доступность веб-интерфейса..."
          curl -s -I http://localhost:8111/login.html || echo "Сервер еще разогревается..."

      - name: Extract Super User Token
        run: |
          echo "Ожидаем генерацию Super User Token в логах..."
          TOKEN="not_found"
          for i in {1..30}; do
            LOGS=$(docker logs teamcity-server 2>&1)
            if echo "$LOGS" | grep -q "Super User Token"; then
              TOKEN=$(echo "$LOGS" | grep -oP "Super User Token:\s+\K.*")
              break
            fi
            echo "Токен еще не сгенерирован, ждем..."
            sleep 5
          done
          
          if [ "$TOKEN" = "not_found" ] || [ -z "$TOKEN" ]; then
            echo "Ошибка: Не удалось найти токен в логах в течение отведенного времени!"
            echo "=== ПОЛНЫЕ ЛОГИ СЕРВЕРА ДЛЯ ОТЛАДКИ ==="
            docker logs teamcity-server
            exit 1
          fi
          
          echo "Токен успешно заэкрасен: $TOKEN"
          echo "TEAMCITY_TOKEN=$TOKEN" >> $GITHUB_ENV
