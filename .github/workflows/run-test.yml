name: Checkstyle, TeamCity Server & Agent

on:
  push:
    branches: [ nikita_ci ]
  workflow_dispatch:

jobs:
  infrastructure:
    name: Code Control & Services Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: 'maven'

      - name: Run Checkstyle
        run: mvn checkstyle:check

      - name: Create Custom Docker Network
        run: docker network create test-network

      - name: Start TeamCity Server
        run: |
          docker run -d --name teamcity-server \
            --network test-network \
            -p 8111:8111 \
            --user 0 \
            -e TEAMCITY_SERVER_OPTS="-Dteamcity.startup.maintenance=false" \
            jetbrains/teamcity-server:latest

      # 🔥 Автоматическое ожидание и экстракт токена
      - name: Wait for Server and Extract Token
        run: |
          echo "Ожидаем генерацию Super User Token в логах..."
          TOKEN="not_found"
          
          # Цикл на 5 минут максимум, но завершится досрочно, как только токен появится
          for i in {1..60}; do
            LOGS=$(docker logs teamcity-server 2>&1)
          
            if echo "$LOGS" | grep -q "Super User Token"; then
              # Вырезаем только цифры токена
              TOKEN=$(echo "$LOGS" | grep -oP "Super User Token:\s+\K\d+")
              break
            fi
          
            echo "Сервер запускается, токен еще не сгенерирован (попытка $i/60)..."
            sleep 5
          done
          
          if [ "$TOKEN" = "not_found" ] || [ -z "$TOKEN" ]; then
            echo "Ошибка: Превышено время ожидания токена!"
            echo "=== ПОЛНЫЕ ЛОГИ СЕРВЕРА ДЛЯ ОТЛАДКИ ==="
            docker logs teamcity-server
            exit 1
          fi
          
          echo "Токен успешно заэкрасен!"
          # Сохраняем в системный буфер GitHub Actions
          echo "TEAMCITY_TOKEN=$TOKEN" >> $GITHUB_ENV

      # 🔥 ДОБАВЛЯЕМ АГЕНТА: Он запускается строго после того, как сервер выдал токен
      - name: Start TeamCity Agent
        run: |
          echo "Сервер готов. Запускаем Агента..."
          docker run -d --name teamcity-agent \
            --network test-network \
            -e SERVER_URL="http://teamcity-server:8111" \
            jetbrains/teamcity-agent:latest
          
          echo "Проверяем статус запущенных контейнеров:"
          docker ps -a
