name: Checkstyle, Parallel Matrix Tests & Allure Pages

on:
  push:
    branches: [ nikita_ci ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ЭТАП 1: ПРОВЕРКА КАЧЕСТВА КОДА
  checkstyle:
    name: Code Control (Checkstyle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: 'maven'

      - name: Run Checkstyle Validation
        run: mvn checkstyle:check

  # ЭТАП 2: ПАРАЛЛЕЛЬНЫЙ ВЕЕР ТЕСТОВ (МАТРИЦА КОЛЛЕГИ + ИНФРАСТРУКТУРА)
  test-matrix:
    name: Run ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: checkstyle # Запустится только если Checkstyle прошёл успешно
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            profile: api
            browser: chrome
          - name: ui-chrome
            profile: ui
            browser: chrome
          - name: ui-firefox
            profile: ui
            browser: firefox
          - name: ui-opera
            profile: ui
            browser: opera

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: 'maven'

      # Использование скрипта для поднятия Docker Compose и Selenoid
      - name: Start Infrastructure and Pull Browsers
        run: |
          cd infra/docker_compose
          chmod +x restart_docker.sh
          ./restart_docker.sh

      # УМНОЕ ДИНАМИЧЕСКОЕ ОЖИДАНИЕ СЕРВЕРА (ВСТАВЛЕНО СЮДА ВЗАМЕН SLEEP 40)
      - name: Wait for TeamCity Server Token
        run: |
          echo "⏳ Ожидание инициализации TeamCity и генерации супертокена..."
          TIMEOUT=180
          ELAPSED=0
          until docker logs teamcity-server 2>&1 | grep -i 'Super user authentication token' > /dev/null || [ $ELAPSED -eq $TIMEOUT ]; do
            sleep 5
            ELAPSED=$((ELAPSED + 5))
            echo "⌛ Прошло $ELAPSED сек... Сервер всё ещё настраивает базу данных..."
          done
          
          if [ $ELAPSED -eq $TIMEOUT ]; then
            echo "❌ Превышено время ожидания старта TeamCity (3 минуты)."
            exit 1
          fi
          echo "✅ TeamCity успешно сгенерировал токен! Начинаем извлечение..."

      # Извлечение токера силами хоста GitHub Actions перед запуском тестов
      - name: Extract Super User Token
        id: get_token
        run: |
          RAW_TOKEN=$(docker logs teamcity-server 2>&1 | grep -i 'Super user authentication token' | tail -1)
          FETCHED_TOKEN=$(echo "$RAW_TOKEN" | grep -oE '[0-9]+' | tr -d '\r\n ')
          if [ -z "$FETCHED_TOKEN" ]; then
            echo "TOKEN=auto" >> $GITHUB_ENV
          else
            echo "TOKEN=$FETCHED_TOKEN" >> $GITHUB_ENV
          fi

      # Запуск конкретного бакета тестов из матрицы с пробросом токена и браузера
      - name: Run Matrix Test Bucket
        env:
          APIBASEURL: http://host.docker.internal:8111
          UIBASEURL: http://host.docker.internal:8111
          SUPERUSER_TOKEN: ${{ env.TOKEN }}
        run: |
          chmod +x run-tests.sh
          ./run-tests.sh ${{ matrix.profile }}

      # Вытаскиваем сырые результаты из контейнера наружу для сборщика
      - name: Extract Allure Results From Container
        if: always()
        run: |
          mkdir -p target/allure-results
          cp -r allure-results/${{ matrix.profile }}_${{ matrix.browser }}/. target/allure-results/ || true

      # Сохраняем промежуточные результаты каждого браузера в артефакты
      - name: Upload Intermediate Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.name }}
          path: target/allure-results/
          if-no-files-found: warn
          retention-days: 1

  # ЭТАП 3: СХЛОПЫВАНИЕ В ОДИН АВТОНОМНЫЙ ФАЙЛ INDEX.HTML
  allure-report:
    name: Merge Results & Generate Single HTML Report
    runs-on: ubuntu-latest
    needs: test-matrix
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Allure Results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: target/allure-results
          merge-multiple: true

      - name: Install Allure CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y npm
          sudo npm install -g allure-commandline --save-dev
          allure --version

      - name: Create Environment Properties
        run: |
          echo "Browser_API=Passed" >> target/allure-results/environment.properties
          echo "Browser_Chrome=Passed" >> target/allure-results/environment.properties
          echo "Browser_Firefox=Passed" >> target/allure-results/environment.properties
          echo "Browser_Opera=Passed" >> target/allure-results/environment.properties

      # Собираем отчет в режиме --single-file (всё упаковывается в один index.html)
      - name: Generate Single File Allure Report
        run: |
          allure generate target/allure-results --clean --single-file -o single-report-dir

      # Выкладываем этот index.html прямо в список артефактов на Summary
      - name: Upload Final index.html to Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: single-file-allure-report
          path: single-report-dir/index.html
          retention-days: 7
